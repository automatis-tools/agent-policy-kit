# Merge these tables into the config provisioned by Kimi; do not duplicate
# existing tables. Preserve native provider/login entries and model metadata.
# This example targets Kimi Code 2.4; it does not establish paid entitlement.

[models.subagent-code]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = ["thinking", "always_thinking", "image_in", "tool_use"]
support_efforts = ["low", "high", "max"]

[models.subagent-code.overrides]
default_effort = "high"

[models.subagent-light]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 1048576
capabilities = ["thinking", "always_thinking", "image_in", "video_in", "tool_use"]
support_efforts = ["low", "high", "max"]

[models.subagent-light.overrides]
default_effort = "low"

[secondary_model]
default_model = "subagent-code"

[secondary_model.models]
subagent-code = "Code, debugging and review. K3 high."
subagent-light = "Search, extraction and mechanical tasks. K2.8 low."
